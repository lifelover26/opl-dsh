name: Official Desktop compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitattributes'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
      - 'cordis.patch.yml'
      - 'src/**'
      - 'installer/**'
      - 'vendor/dsh-superagent/**'
      - 'scripts/build-superagent.mjs'
      - 'scripts/build-native-bridge.mjs'
      - 'scripts/build-feature-plugins.mjs'
      - 'scripts/qualif*.mjs'
      - 'scripts/verify-official-runtime.mjs'
      - '.github/workflows/official-compatibility.yml'
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - 'package.json'
      - 'package-lock.json'
      - 'build.mjs'
      - 'cordis.patch.yml'
      - 'src/**'
      - 'installer/**'
      - 'vendor/dsh-superagent/**'
      - 'scripts/build-superagent.mjs'
      - 'scripts/build-native-bridge.mjs'
      - 'scripts/build-feature-plugins.mjs'
      - 'scripts/qualif*.mjs'
      - 'scripts/verify-official-runtime.mjs'
      - '.github/workflows/official-compatibility.yml'
  release:
    types: [published]
permissions:
  contents: read
jobs:
  official-desktop:
    name: Official Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The official macOS distribution is arm64-only. Do not substitute Intel.
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/qualification.test.mjs
      - name: Verify split plugins and official collaboration contracts
        run: |
          node node_modules/vitest/vitest.mjs run tests/collaboration/official-tools.spec.ts tests/collaboration/external-wait.spec.ts tests/collaboration/suite-control.spec.ts tests/execution/permission-memory.spec.ts tests/updates/admission.spec.ts
          node --test --test-concurrency=1 tests/artifact.test.mjs tests/split-plugins.test.mjs tests/profile.test.mjs tests/superagent.test.mjs
      - name: Verify shared SuperAgent tests on Windows
        if: matrix.os == 'windows-latest'
        # Bound parallel SQLite/fixture I/O on the hosted Windows disk; retain test deadlines.
        run: npm test --workspace dsh-superagent -- --maxWorkers=1
      - name: Verify Windows native launcher and ACL regressions
        if: matrix.os == 'windows-latest'
        run: |
          node node_modules/vitest/vitest.mjs run tests/execution/harness-registry.spec.ts -t "probes a cmd shim"
          node node_modules/vitest/vitest.mjs run tests/execution/antigravity/process-lifecycle.spec.ts
          node --test tests/native-bridge.test.mjs tests/windows-acl.test.mjs tests/windows-official-installer.test.mjs
          node --test tests/update-runner.test.mjs
      - name: Download verified official desktop and run isolated qualification
        id: qualification
        run: node scripts/qualify-official-runtime.mjs --download --evidence dist/official-qualification.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() && (steps.qualification.outcome == 'success' || steps.qualification.outcome == 'failure') }}
        with:
          name: official-qualification-${{ matrix.os }}
          path: |
            dist/official-qualification.json
            dist/official-qualification-client-*.png
          if-no-files-found: ${{ steps.qualification.outcome == 'success' && 'error' || 'warn' }}
