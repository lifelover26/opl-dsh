name: Stable release

on:
  schedule:
    - cron: '37 18 * * *'
  push:
    tags: ['opl-dsh-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-dsh-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      copilot-requests: write
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      official_version: ${{ steps.candidate.outputs.official_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Load shared release-note writer policy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-shared-release-note-writer.mjs
      - name: Detect enhancement or official desktop updates, or resume a frozen tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
        run: node scripts/prepare-daily-release.mjs

  package:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require a frozen canonical tag and native arm64 packaging
        env:
          OPL_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { version } = JSON.parse(readFileSync('package.json'))
          if (process.arch !== 'arm64') throw Error('Official macOS packaging requires arm64')
          if (process.env.OPL_RELEASE_TAG !== `opl-dsh-v${version}`) throw Error('Invalid canonical release tag')
          const tagged = execFileSync('git', ['rev-parse', `${process.env.OPL_RELEASE_TAG}^{commit}`], { encoding: 'utf8' }).trim()
          if (tagged !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()) throw Error('Release tag moved')
          if (execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim()) throw Error('Dirty source candidate')
          NODE
      - name: Install Windows installer compiler
        run: brew install nsis
      - run: npm ci --ignore-scripts
      - run: npm run generate:rpc
      - run: git diff --exit-code
      - run: npm run check:rpc
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run format:check
      - name: Load feed reader from this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: dist/release-runner
      - name: Resolve the live official desktop feed version
        env:
          OPL_PREPARED_OFFICIAL_VERSION: ${{ needs.prepare.outputs.official_version }}
        run: |
          node --input-type=module - <<'NODE'
          import { readOfficialDesktopFeeds } from './dist/release-runner/scripts/official-desktop-feeds.mjs'
          const feeds = await readOfficialDesktopFeeds()
          const version = feeds['mac-arm64'].version
          if (version !== process.env.OPL_PREPARED_OFFICIAL_VERSION)
            throw Error('Official feeds changed after release preparation')
          await import('node:fs/promises').then(({ appendFile }) => appendFile(process.env.GITHUB_ENV, `OPL_OFFICIAL_VERSION=${version}\n`))
          console.log(`Using official desktop feed version ${version}`)
          NODE
      - run: npm run package
      - run: npm test
      - name: Pair both live official feeds with the built candidate
        run: npm run release:manifest
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: |
            dist/OPL-DSH-Enhancements.zip
            dist/OPL-DSH-Installer-mac-arm64.dmg
            dist/OPL-DSH-Installer-windows-x64.exe
            dist/release-manifest.json
          if-no-files-found: error

  qualify:
    needs: [prepare, package]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify shared SuperAgent tests on Windows
        if: runner.os == 'Windows'
        run: npm test --workspace dsh-superagent
      - name: Verify Windows launcher and ACL regressions
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run build:bridge
          node node_modules/vitest/vitest.mjs run tests/execution/harness-registry.spec.ts -t "probes a cmd shim"
          node --test tests/native-bridge.test.mjs tests/windows-acl.test.mjs
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: dist
      - name: Extract the exact shipped payload on macOS
        if: runner.os == 'macOS'
        run: unzip -q dist/OPL-DSH-Enhancements.zip -d 'dist/OPL DSH 一键安装'
      - name: Extract the exact shipped payload on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'dist/OPL DSH 一键安装') {
            Remove-Item -LiteralPath 'dist/OPL DSH 一键安装' -Recurse -Force
          }
          Expand-Archive -LiteralPath 'dist/OPL-DSH-Enhancements.zip' -DestinationPath 'dist/OPL DSH 一键安装'
      - name: Require clean qualification source
        shell: bash
        run: |
          git diff --exit-code
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process'
          const status = execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim()
          if (status) throw Error('Qualification source is dirty: ' + status)
          NODE
      - name: Check out the qualification runner from this workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: dist/qualification-runner
      - name: Qualify unmodified official Desktop against the shipped bytes
        run: node dist/qualification-runner/scripts/qualify-official-runtime.mjs --download --payload "dist/OPL DSH 一键安装" --evidence dist/official-qualification.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-qualification-${{ matrix.os }}
          path: |
            dist/official-qualification.json
            dist/official-qualification-client-*.png
          if-no-files-found: error

  publish:
    needs: [prepare, package, qualify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-qualification-macos-15
          path: dist/evidence/macos-15
      - uses: actions/download-artifact@v8
        with:
          name: release-qualification-windows-latest
          path: dist/evidence/windows-latest
      - name: Verify provenance, publish, and read back all public assets
        env:
          GH_TOKEN: ${{ github.token }}
          OPL_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/publish-stable-release.mjs
      - name: Retain publication and previous-release audit records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-audit
          path: dist/release-audit/
          if-no-files-found: warn
